name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_PROJECT_ID: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRICE_ESSENCIAL: price_ci_essencial
      STRIPE_PRICE_GROWTH: price_ci_growth
      STRIPE_PRICE_INTELLIGENCE: price_ci_intelligence
      STRIPE_PRICE_FOUNDERS: price_ci_founders
      LOVABLE_AI_MODEL: google/gemini-3.5-flash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Business rules regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Install dependencies
        # package.json is currently ahead of the committed lockfile. We validate
        # the declared dependency graph without mutating/depending on that stale lock.
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
